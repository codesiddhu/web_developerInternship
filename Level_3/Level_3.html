<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level 3 Task 1 - Gallery & Slideshow</title>
<style>
  body{font-family:Segoe UI,Arial,sans-serif;margin:0;padding:24px;background:#f6f8fb}
  h2{text-align:center}

  /* Gallery: thumbnails enlarge on click (CSS :target lightbox) */
  .gallery{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .gallery img{width:160px;height:110px;object-fit:cover;border-radius:6px}
  .lightbox{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center}
  .lightbox:target{display:flex}
  .lightbox img{max-width:90%;max-height:85%;border-radius:8px}
  .lightbox .close{position:absolute;top:16px;right:24px;color:#fff;font-size:2.4rem;text-decoration:none}

  /* Slideshow: auto transitions with CSS keyframes (3 images, 12s loop) */
  .slideshow{position:relative;max-width:640px;height:320px;margin:auto;overflow:hidden;border-radius:8px}
  .slideshow img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:fade 12s infinite}
  .slideshow img:nth-child(2){animation-delay:4s}
  .slideshow img:nth-child(3){animation-delay:8s}
  @keyframes fade{0%{opacity:0}8%{opacity:1}33%{opacity:1}41%{opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.slideshow img{animation:none}.slideshow img:first-child{opacity:1}}
</style>
</head>
<body>
<h2>Image Gallery</h2>
<div class="gallery">
  <a href="#img1"><img src="https://picsum.photos/id/10/160/110" alt="Forest"></a>
  <a href="#img2"><img src="https://picsum.photos/id/20/160/110" alt="Desk"></a>
  <a href="#img3"><img src="https://picsum.photos/id/30/160/110" alt="Mug"></a>
  <a href="#img4"><img src="https://picsum.photos/id/40/160/110" alt="Cat"></a>
</div>

<div class="lightbox" id="img1"><a class="close" href="#">&times;</a><img src="https://picsum.photos/id/10/1000/700" alt="Forest"></div>
<div class="lightbox" id="img2"><a class="close" href="#">&times;</a><img src="https://picsum.photos/id/20/1000/700" alt="Desk"></div>
<div class="lightbox" id="img3"><a class="close" href="#">&times;</a><img src="https://picsum.photos/id/30/1000/700" alt="Mug"></div>
<div class="lightbox" id="img4"><a class="close" href="#">&times;</a><img src="https://picsum.photos/id/40/1000/700" alt="Cat"></div>

<h2>Image Slideshow</h2>
<div class="slideshow">
  <img src="https://picsum.photos/id/1015/800/400" alt="River">
  <img src="https://picsum.photos/id/1018/800/400" alt="Mountains">
  <img src="https://picsum.photos/id/1039/800/400" alt="Waterfall">
</div>
</body>
</html>
