<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level 2 - Frameworks & Responsive Design</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  /* Task 2b: hamburger menu using only HTML + CSS (checkbox trick) */
  .topbar{background:#1f3a5f;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:0 20px}
  .logo{color:#fff;font-weight:700;padding:14px 0}
  .menu{display:flex;list-style:none;margin:0;padding:0}
  .menu a{color:#fff;text-decoration:none;padding:16px 16px;display:block}
  .menu a:hover{background:#2d5286}
  #toggle,.burger{display:none}
  .burger{color:#fff;font-size:1.8rem;cursor:pointer}

  /* Task 2a: media queries */
  @media (max-width: 768px){
    .burger{display:block}
    .menu{display:none;flex-direction:column;width:100%}
    #toggle:checked ~ .menu{display:flex}
    h1{font-size:1.6rem}
  }
  @media (min-width: 769px){ h1{font-size:2.4rem} }
</style>
</head>
<body class="bg-light">

<header class="topbar">
  <span class="logo">Cognifyz Intern</span>
  <input type="checkbox" id="toggle">
  <label for="toggle" class="burger">&#9776;</label>
  <ul class="menu">
    <li><a href="#cards">Card</a></li>
    <li><a href="#grid">Grid</a></li>
    <li><a href="#about">About</a></li>
  </ul>
</header>

<div class="container py-4">
  <h1 class="mb-4">Responsive Page</h1>

  <!-- Task 1a: responsive card (Bootstrap) -->
  <h2 id="cards" class="h4">Card component</h2>
  <div class="card mb-5" style="max-width:420px">
    <img src="https://picsum.photos/420/220" class="card-img-top" alt="Card image">
    <div class="card-body">
      <h5 class="card-title">Card title</h5>
      <p class="card-text">A responsive card with an image and text built using Bootstrap.</p>
      <a href="#" class="btn btn-primary">Read more</a>
    </div>
  </div>

  <!-- Task 1b: responsive grid (1 column phone, 2 tablet, 3 desktop) -->
  <h2 id="grid" class="h4">Responsive grid</h2>
  <div class="row g-3 mb-5">
    <div class="col-12 col-md-6 col-lg-4"><div class="p-4 bg-primary text-white rounded">Box 1</div></div>
    <div class="col-12 col-md-6 col-lg-4"><div class="p-4 bg-success text-white rounded">Box 2</div></div>
    <div class="col-12 col-md-6 col-lg-4"><div class="p-4 bg-danger text-white rounded">Box 3</div></div>
  </div>

  <p id="about">Resize the browser: the grid reflows and the menu collapses into a hamburger below 768px.</p>
</div>
</body>
</html>
